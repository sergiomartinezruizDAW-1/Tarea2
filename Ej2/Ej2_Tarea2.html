<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listas2</title>
    <link rel="stylesheet" href="CSS\estilo.css">
</head>

<body>
    <header>
        <h1>Listas de menú</h1>
    </header>

    <main>
        <nav class="Horizontal">
            <h2>Menú horizontal</h2>
            <ul>
                <li>Opción 1</li>
                <li>Opción 2</li>
                <li>Opción 3</li>
                <li>Opción 4</li>
                <li>Opción 5</li>
            </ul>
        </nav>
        <nav class="Vertical">
            <h2>Menú vertical</h2>
            <ul>
                <li>Opción 1</li>
                <li>Opción 2</li>
                <li class="Vertical3">Opción 3</li>
                <li>Opción 4</li>
                <li>Opción 5</li>
            </ul>
        </nav>
    </main>
</body>
